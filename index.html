                                <line x1="72" y1="52" x2="72" y2="60" stroke="#FF5500" strokeWidth="2.5" strokeLinecap="round" className="animate-pulse" />
                                <defs>
                                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stopColor="#00F0FF" />
                                        <stop offset="50%" stopColor="#0055FF" />
                                        <stop offset="100%" stopColor="#FF5500" />
                                    </linearGradient>
                                    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stopColor="#FFFFFF" />
                                        <stop offset="60%" stopColor="#00F0FF" />
                                        <stop offset="100%" stopColor="#0055FF" />
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>
                    </div>
                    <div className="flex flex-col">
                        <span className="text-xl font-black font-mono tracking-tight leading-none text-transparent bg-clip-text bg-gradient-to-r from-brand-blue via-white to-brand-orange">
                            Audio<span className="text-brand-orange">Crew</span>
                        </span>
                        <span className="text-[8px] font-mono tracking-widest uppercase text-gray-400 font-bold mt-1">
                            FOUR MINDS • ONE SOUND
                        </span>
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            const [lang, setLang] = useState(() => localStorage.getItem('audiocrew_lang') || 'ar');
            const [isDark, setIsDark] = useState(true);
            const [mobileMenu, setMobileMenu] = useState(false);

            // Calculator Interactive State
            const [calcType, setCalcType] = useState('mosque');
            const [calcLength, setCalcLength] = useState(20);
            const [calcWidth, setCalcWidth] = useState(15);
            const [calcHeight, setCalcHeight] = useState(6);
            const [calcTier, setCalcTier] = useState('pro');

            // DSP Audio EQ Controls Simulation State
            const [eqBass, setEqBass] = useState(3);
            const [eqMid, setEqMid] = useState(-1);
            const [eqTreble, setEqTreble] = useState(4);
            const [eqGain, setEqGain] = useState(0);

            // Portfolio Modal State
            const [activePortFilter, setActivePortFilter] = useState('all');
            const [selectedProject, setSelectedProject] = useState(null);

            // Quote Form State
            const [quoteSubmitted, setQuoteSubmitted] = useState(false);
            const [quoteData, setQuoteData] = useState({});

            const t = translations[lang];

            // Handle Theme & LocalStorage
            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.body.className = "bg-brand-darkBg text-gray-100 antialiased selection:bg-brand-blue selection:text-black";
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.className = "bg-brand-lightBg text-gray-800 antialiased selection:bg-brand-orange selection:text-white";
                }
            }, [isDark]);

            // Handle Language Direction
            const toggleLang = () => {
                const nextLang = lang === 'ar' ? 'en' : 'ar';
                setLang(nextLang);
                localStorage.setItem('audiocrew_lang', nextLang);
                document.documentElement.dir = nextLang === 'ar' ? 'rtl' : 'ltr';
                document.documentElement.lang = nextLang;
            };

            // Canvas Background Particles Animation
            const particleCanvasRef = useRef(null);
            useEffect(() => {
                const canvas = particleCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', resize);
                resize();

                const particles = Array.from({ length: 45 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    radius: Math.random() * 2 + 1,
                    color: Math.random() > 0.5 ? '#00F0FF' : '#FF5500'
                }));

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach((p, idx) => {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();

                        for (let j = idx + 1; j < particles.length; j++) {
                            const p2 = particles[j];
                            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                            if (dist < 140) {
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = isDark ? 'rgba(0, 240, 255, 0.05)' : 'rgba(0, 85, 255, 0.08)';
                                ctx.stroke();
                            }
                        }
                    });
                    animationId = requestAnimationFrame(render);
                };
                render();

                return () => {
                    window.removeEventListener('resize', resize);
                    cancelAnimationFrame(animationId);
                };
            }, [isDark]);

            // Interactive DSP Visualizer Canvas
            const eqCanvasRef = useRef(null);
            useEffect(() => {
                const canvas = eqCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;
                let phase = 0;

                const render = () => {
                    if (canvas.parentElement) {
                        canvas.width = canvas.parentElement.offsetWidth;
                        canvas.height = canvas.parentElement.offsetHeight;
                    }
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    const bars = 40;
                    const barWidth = canvas.width / bars;

                    for (let i = 0; i < bars; i++) {
                        let freqFactor = 1;
                        if (i < 12) freqFactor += eqBass * 0.12;
                        else if (i < 28) freqFactor += eqMid * 0.12;
                        else freqFactor += eqTreble * 0.12;

                        const baseVal = Math.sin(i * 0.25 + phase) * 0.3 + Math.cos(i * 0.15 - phase) * 0.3 + 0.5;
                        const finalHeight = Math.min(canvas.height * 0.9, Math.max(8, baseVal * canvas.height * 0.7 * freqFactor));
                        const x = i * barWidth;
                        const y = (canvas.height - finalHeight) / 2;

                        const grad = ctx.createLinearGradient(0, y, 0, y + finalHeight);
                        grad.addColorStop(0, '#00F0FF');
                        grad.addColorStop(0.5, '#0055FF');
                        grad.addColorStop(1, '#FF5500');

                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.roundRect(x + 2, y, barWidth - 4, finalHeight, [3]);
                        ctx.fill();
                    }

                    phase += 0.05;
                    animationId = requestAnimationFrame(render);
                };
                render();

                return () => cancelAnimationFrame(animationId);
            }, [eqBass, eqMid, eqTreble, eqGain]);

            // Acoustic Calculation Results
            const calcResults = useMemo(() => {
                const area = calcLength * calcWidth;
                const volume = area * calcHeight;
                let spkFactor = 25;
                let rt60Base = 1.8;

                if (calcType === 'mosque') { spkFactor = 20; rt60Base = 2.1; }
                else if (calcType === 'church') { spkFactor = 18; rt60Base = 2.6; }
                else if (calcType === 'gov') { spkFactor = 30; rt60Base = 1.1; }
                else if (calcType === 'outdoor') { spkFactor = 35; rt60Base = 0.5; }

                const speakers = Math.max(4, Math.ceil(area / spkFactor));
                const watts = Math.ceil(speakers * (calcTier === 'advanced' ? 80 : calcTier === 'pro' ? 60 : 40));
                const rt60 = (rt60Base * (volume / 1000) * 0.4).toFixed(2);
                const sti = (0.85 - (rt60 * 0.12)).toFixed(2);

                return {
                    area,
                    volume,
                    speakers,
                    watts,
                    rt60: Math.max(0.6, rt60),
                    sti: Math.min(0.92, Math.max(0.45, sti))
                };
            }, [calcType, calcLength, calcWidth, calcHeight, calcTier]);

            const filteredProjects = useMemo(() => {
                if (activePortFilter === 'all') return portfolioItems;
                return portfolioItems.filter(p => p.category === activePortFilter);
            }, [activePortFilter]);

            const handleQuoteSubmit = (e) => {
                e.preventDefault();
                const form = e.target;
                const data = {
                    name: form.name.value,
                    phone: form.phone.value,
                    facility: form.facility.value,
                    currency: form.currency.value,
                    budget: form.budget.value,
                    desc: form.desc.value
                };
                setQuoteData(data);
                setQuoteSubmitted(true);
            };

            return (
                <div className="relative min-h-screen overflow-hidden">
                    {/* Background Canvas Particles */}
                    <canvas ref={particleCanvasRef} className="fixed inset-0 pointer-events-none z-0" />

                    {/* STICKY HEADER */}
                    <header className={`sticky top-0 z-50 transition-all duration-300 ${isDark ? 'glass-dark' : 'glass-light'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            <a href="#home">
                                <AudioCrewLogo isDark={isDark} />
                            </a>

                            {/* Desktop Navigation */}
                            <nav className="hidden lg:flex items-center gap-7 text-xs font-semibold uppercase tracking-wider">
                                <a href="#home" className="hover:text-brand-blue transition-colors">{t.nav.home}</a>
                                <a href="#services" className="hover:text-brand-blue transition-colors">{t.nav.services}</a>
                                <a href="#calculator" className="hover:text-brand-blue transition-colors">{t.nav.calculator}</a>
                                <a href="#portfolio" className="hover:text-brand-blue transition-colors">{t.nav.portfolio}</a>
                                <a href="#process" className="hover:text-brand-blue transition-colors">{t.nav.process}</a>
                                <a href="#team" className="hover:text-brand-blue transition-colors">{t.nav.team}</a>
                            </nav>

                            {/* Controls & CTA */}
                            <div className="hidden lg:flex items-center gap-4">
                                <button onClick={toggleLang} className="px-3 py-1.5 rounded-lg border border-gray-700/60 font-mono text-xs hover:border-brand-blue transition-all">
                                    {lang === 'ar' ? 'English' : 'العربية'}
                                </button>
                                <button onClick={() => setIsDark(!isDark)} className="p-2 rounded-lg border border-gray-700/60 hover:border-brand-orange transition-all">
                                    {isDark ? '☀️' : '🌙'}
                                </button>
                                <a href="#quote" className="bg-gradient-to-r from-brand-blue to-brand-deepBlue text-black font-extrabold text-xs px-5 py-2.5 rounded-lg shadow-lg hover:shadow-brand-blue/30 transition-all uppercase tracking-wider">
                                    {t.nav.quote}
                                </a>
                            </div>

                            {/* Mobile Toggle */}
                            <button onClick={() => setMobileMenu(!mobileMenu)} className="lg:hidden text-2xl p-2">
                                ☰
                            </button>
                        </div>

                        {/* Mobile Menu Dropdown */}
                        {mobileMenu && (
                            <div className={`lg:hidden px-6 py-6 space-y-4 border-b border-gray-800 ${isDark ? 'bg-brand-darkBg' : 'bg-white'}`}>
                                <a href="#home" onClick={() => setMobileMenu(false)} className="block font-semibold">{t.nav.home}</a>
                                <a href="#services" onClick={() => setMobileMenu(false)} className="block font-semibold">{t.nav.services}</a>
                                <a href="#calculator" onClick={() => setMobileMenu(false)} className="block font-semibold">{t.nav.calculator}</a>
                                <a href="#portfolio" onClick={() => setMobileMenu(false)} className="block font-semibold">{t.nav.portfolio}</a>
                                <a href="#team" onClick={() => setMobileMenu(false)} className="block font-semibold">{t.nav.team}</a>
                                <div className="flex items-center gap-4 pt-4 border-t border-gray-800">
                                    <button onClick={toggleLang} className="px-3 py-1.5 rounded border border-gray-700 text-xs">{lang === 'ar' ? 'English' : 'العربية'}</button>
                                    <button onClick={() => setIsDark(!isDark)} className="p-1.5 rounded border border-gray-700 text-xs">{isDark ? '☀️ Light' : '🌙 Dark'}</button>
                                </div>
                            </div>
                        )}
                    </header>

                    {/* HERO SECTION */}
                    <section id="home" className="relative pt-12 pb-24 z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-8">
                            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-brand-blue/10 border border-brand-blue/40 text-brand-blue text-xs font-mono font-bold tracking-widest uppercase animate-bounce">
                                <span>✦</span> {t.hero.badge}
                            </div>

                            <h1 className="text-4xl sm:text-6xl lg:text-7xl font-black tracking-tight leading-tight max-w-5xl mx-auto">
                                {t.hero.title} <span className="gradient-text-brand">{t.hero.highlight}</span>
                            </h1>

                            <p className="text-base sm:text-xl text-gray-400 max-w-3xl mx-auto leading-relaxed">
                                {t.hero.subtitle}
                            </p>

                            <div className="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
                                <a href="#quote" className="w-full sm:w-auto bg-gradient-to-r from-brand-orange to-brand-neonOrange text-white font-bold px-8 py-4 rounded-xl shadow-xl hover:shadow-brand-orange/40 transition-all">
                                    {t.hero.ctaPrimary}
                                </a>
                                <a href="#calculator" className="w-full sm:w-auto border border-brand-blue/50 hover:border-brand-blue text-brand-blue font-bold px-8 py-4 rounded-xl transition-all">
                                    {t.hero.ctaSecondary}
                                </a>
                            </div>

                            {/* INTERACTIVE DSP SPECTRUM EQUALIZER */}
                            <div className={`mt-16 p-6 rounded-2xl border max-w-4xl mx-auto ${isDark ? 'glass-dark' : 'glass-light'}`}>
                                <div className="flex items-center justify-between mb-4">
                                    <span className="text-xs font-mono text-brand-blue font-bold">{t.hero.dspTitle}</span>
                                    <span className="text-[10px] font-mono text-brand-orange animate-pulse">● LIVE AUDIO SIGNAL ACTIVE</span>
                                </div>

                                <div className="h-40 relative rounded-xl overflow-hidden bg-black/40 border border-gray-800">
                                    <canvas ref={eqCanvasRef} className="w-full h-full" />
                                </div>

                                {/* DSP Controls Sliders */}
                                <div className="grid grid-cols-3 gap-6 pt-6 dir-ltr">
                                    <div>
                                        <div className="flex justify-between text-xs font-mono text-gray-400 mb-1">
                                            <span>BASS (80Hz)</span>
                                            <span className="text-brand-blue">{eqBass} dB</span>
                                        </div>
                                        <input type="range" min="-10" max="10" value={eqBass} onChange={e => setEqBass(Number(e.target.value))} className="w-full slider-custom" />
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-xs font-mono text-gray-400 mb-1">
                                            <span>MID (1.2kHz)</span>
                                            <span className="text-brand-blue">{eqMid} dB</span>
                                        </div>
                                        <input type="range" min="-10" max="10" value={eqMid} onChange={e => setEqMid(Number(e.target.value))} className="w-full slider-custom" />
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-xs font-mono text-gray-400 mb-1">
                                            <span>TREBLE (8kHz)</span>
                                            <span className="text-brand-blue">{eqTreble} dB</span>
                                        </div>
                                        <input type="range" min="-10" max="10" value={eqTreble} onChange={e => setEqTreble(Number(e.target.value))} className="w-full slider-custom" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* SERVICES SECTION */}
                    <section id="services" className="py-24 z-10 relative">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center space-y-3 mb-16">
                                <span className="text-xs font-mono text-brand-orange uppercase font-bold tracking-widest">{t.services.tag}</span>
                                <h2 className="text-3xl sm:text-5xl font-extrabold">{t.services.title}</h2>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {t.services.items.map((srv, i) => (
                                    <div key={i} className={`p-8 rounded-2xl transition-all duration-300 group ${isDark ? 'glass-dark' : 'glass-light'}`}>
                                        <div className="text-4xl mb-4 transform group-hover:scale-125 transition-transform">{srv.icon}</div>
                                        <h3 className="text-xl font-bold mb-3 group-hover:text-brand-blue transition-colors">{srv.title}</h3>
                                        <p className="text-sm text-gray-400 leading-relaxed">{srv.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* CALCULATOR SECTION */}
                    <section id="calculator" className="py-24 z-10 relative bg-black/20">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center space-y-3 mb-16">
                                <span className="text-xs font-mono text-brand-blue uppercase font-bold tracking-widest">{t.calculator.tag}</span>
                                <h2 className="text-3xl sm:text-5xl font-extrabold">{t.calculator.title}</h2>
                                <p className="text-gray-400 max-w-2xl mx-auto text-sm">{t.calculator.subtitle}</p>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                                {/* Inputs */}
                                <div className={`lg:col-span-7 p-8 rounded-2xl space-y-6 ${isDark ? 'glass-dark' : 'glass-light'}`}>
                                    <div>
                                        <label className="block text-xs font-mono uppercase text-gray-400 mb-2">{t.calculator.facilityType}</label>
                                        <select value={calcType} onChange={e => setCalcType(e.target.value)} className="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm focus:border-brand-blue outline-none">
                                            <option value="mosque">{t.calculator.typeMosque}</option>
                                            <option value="church">{t.calculator.typeChurch}</option>
                                            <option value="gov">{t.calculator.typeGov}</option>
                                            <option value="outdoor">{t.calculator.typeOutdoor}</option>
                                        </select>
                                    </div>

                                    <div className="grid grid-cols-3 gap-4 dir-ltr">
                                        <div>
                                            <label className="block text-xs font-mono text-gray-400 mb-1">{t.calculator.length}</label>
                                            <input type="number" min="5" max="150" value={calcLength} onChange={e => setCalcLength(Number(e.target.value))} className="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm focus:border-brand-blue outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-mono text-gray-400 mb-1">{t.calculator.width}</label>
                                            <input type="number" min="5" max="150" value={calcWidth} onChange={e => setCalcWidth(Number(e.target.value))} className="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm focus:border-brand-blue outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-mono text-gray-400 mb-1">{t.calculator.height}</label>
                                            <input type="number" min="3" max="30" value={calcHeight} onChange={e => setCalcHeight(Number(e.target.value))} className="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm focus:border-brand-blue outline-none" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-mono uppercase text-gray-400 mb-2">{t.calculator.tier}</label>
                                        <div className="grid grid-cols-3 gap-3">
                                            {['essential', 'pro', 'advanced'].map(tr => (
                                                <button key={tr} type="button" onClick={() => setCalcTier(tr)} className={`py-3 rounded-xl border text-xs font-bold uppercase transition-all ${calcTier === tr ? 'border-brand-orange bg-brand-orange/20 text-brand-orange' : 'border-gray-800 hover:border-gray-600'}`}>
                                                    {tr}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Results Output Display */}
                                <div className={`lg:col-span-5 p-8 rounded-2xl border border-brand-blue/30 space-y-6 ${isDark ? 'glass-dark' : 'glass-light'}`}>
                                    <h3 className="text-xs font-mono text-brand-blue uppercase tracking-widest font-bold">{t.calculator.calcResultTitle}</h3>

                                    <div className="space-y-4 text-sm font-mono">
                                        <div className="flex justify-between border-b border-gray-800 pb-2">
                                            <span className="text-gray-400">{t.calculator.calculatedArea}</span>
                                            <span className="font-bold text-brand-blue">{calcResults.area} m²</span>
                                        </div>
                                        <div className="flex justify-between border-b border-gray-800 pb-2">
                                            <span className="text-gray-400">{t.calculator.calculatedVolume}</span>
                                            <span className="font-bold">{calcResults.volume} m³</span>
                                        </div>
                                        <div className="flex justify-between border-b border-gray-800 pb-2">
                                            <span className="text-gray-400">{t.calculator.speakersNeeded}</span>
                                            <span className="font-bold text-brand-orange">{calcResults.speakers} Loudspeakers</span>
                                        </div>
                                        <div className="flex justify-between border-b border-gray-800 pb-2">
                                            <span className="text-gray-400">{t.calculator.rmsPower}</span>
                                            <span className="font-bold text-brand-orange">{calcResults.watts} Watts RMS</span>
                                        </div>
                                        <div className="flex justify-between border-b border-gray-800 pb-2">
                                            <span className="text-gray-400">{t.calculator.rt60Estimate}</span>
                                            <span className="font-bold">{calcResults.rt60} Seconds</span>
                                        </div>
                                        <div className="flex justify-between border-b border-gray-800 pb-2">
                                            <span className="text-gray-400">{t.calculator.stiRating}</span>
                                            <span className="font-bold text-emerald-400">{calcResults.sti}</span>
                                        </div>
                                    </div>

                                    <a href="#quote" className="block text-center w-full bg-brand-blue text-black font-extrabold py-3.5 rounded-xl hover:bg-brand-blue/80 transition-colors uppercase text-xs">
                                        {t.calculator.cta}
                                    </a>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* PORTFOLIO SECTION */}
                    <section id="portfolio" className="py-24 z-10 relative">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center space-y-3 mb-12">
                                <span className="text-xs font-mono text-brand-orange uppercase font-bold tracking-widest">{t.portfolio.tag}</span>
                                <h2 className="text-3xl sm:text-5xl font-extrabold">{t.portfolio.title}</h2>
                                <p className="text-gray-400 max-w-2xl mx-auto text-sm">{t.portfolio.subtitle}</p>
                            </div>

                            {/* Filter Pills */}
                            <div className="flex justify-center gap-3 mb-12">
                                {[
                                    { id: 'all', label: t.portfolio.filterAll },
                                    { id: 'mosque', label: t.portfolio.filterMosque },
                                    { id: 'hall', label: t.portfolio.filterHall },
                                    { id: 'outdoor', label: t.portfolio.filterOutdoor }
                                ].map(f => (
                                    <button key={f.id} onClick={() => setActivePortFilter(f.id)} className={`px-5 py-2 rounded-full text-xs font-bold font-mono transition-all ${activePortFilter === f.id ? 'bg-brand-blue text-black' : 'border border-gray-800 hover:border-brand-blue text-gray-400'}`}>
                                        {f.label}
                                    </button>
                                ))}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {filteredProjects.map(item => (
                                    <div key={item.id} className={`p-6 rounded-2xl space-y-4 border transition-all hover:scale-105 ${isDark ? 'glass-dark' : 'glass-light'}`}>
                                        <div className="h-40 bg-black/50 rounded-xl flex items-center justify-center border border-gray-800 text-4xl">
                                            🎙️
                                        </div>
                                        <h3 className="text-lg font-bold">{lang === 'ar' ? item.titleAr : item.titleEn}</h3>
                                        <p className="text-xs text-gray-400 leading-relaxed">{lang === 'ar' ? item.descAr : item.descEn}</p>
                                        <button onClick={() => setSelectedProject(item)} className="text-xs font-mono text-brand-blue hover:underline">
                                            {t.portfolio.viewDetails} →
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* PROCESS SECTION */}
                    <section id="process" className="py-24 z-10 relative bg-black/20">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center space-y-3 mb-16">
                                <span className="text-xs font-mono text-brand-blue uppercase font-bold tracking-widest">{t.process.tag}</span>
                                <h2 className="text-3xl sm:text-5xl font-extrabold">{t.process.title}</h2>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {t.process.steps.map((st, i) => (
                                    <div key={i} className={`p-8 rounded-2xl relative ${isDark ? 'glass-dark' : 'glass-light'}`}>
                                        <span className="text-5xl font-mono font-black text-brand-blue/20 absolute top-4 right-6">{st.step}</span>
                                        <h3 className="text-xl font-bold mb-2 pt-4">{st.title}</h3>
                                        <p className="text-sm text-gray-400 leading-relaxed">{st.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* TEAM SECTION WITH REAL ENGINEER PHOTOS */}
                    <section id="team" className="py-24 z-10 relative">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center space-y-3 mb-16">
                                <span className="text-xs font-mono text-brand-orange uppercase font-bold tracking-widest">{t.team.tag}</span>
                                <h2 className="text-3xl sm:text-5xl font-extrabold">{t.team.title}</h2>
                                <p className="text-gray-400 max-w-2xl mx-auto text-sm">{t.team.subtitle}</p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                {[
                                    { img: "./عادل.jfif" },
                                    { img: "./احمد.jfif" },
                                    { img: "./فريد.jfif" },
                                    { img: "./عبدالله.jfif" },
                                ].map((photo, i) => {
                                    const m = t.team.members[i];
                                    return (
                                        <div key={i} className={`p-6 rounded-2xl text-center space-y-4 border transition-all duration-300 hover:-translate-y-2 group ${isDark ? 'glass-dark' : 'glass-light'}`}>
                                            <div className="relative w-28 h-28 mx-auto rounded-full p-1 bg-gradient-to-tr from-brand-blue via-brand-deepBlue to-brand-orange">
                                                <img 
                                                    src={photo.img} 
                                                    alt={m.name} 
                                                    className="w-full h-full object-cover rounded-full"
                                                />
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-lg group-hover:text-brand-blue transition-colors">{m.name}</h3>
                                                <p className="text-xs font-mono text-brand-orange mt-1">{m.role}</p>
                                            </div>
                                            <p className="text-xs text-gray-400 leading-relaxed">{m.desc}</p>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </section>

                    {/* REQUEST A QUOTE SECTION */}
                    <section id="quote" className="py-24 z-10 relative bg-black/30">
                        <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center space-y-3 mb-12">
                                <span className="text-xs font-mono text-brand-blue uppercase font-bold tracking-widest">{t.quote.tag}</span>
                                <h2 className="text-3xl sm:text-5xl font-extrabold">{t.quote.title}</h2>
                                <p className="text-gray-400 text-sm">{t.quote.subtitle}</p>
                            </div>

                            <div className={`p-8 sm:p-10 rounded-2xl border border-brand-blue/30 ${isDark ? 'glass-dark' : 'glass-light'}`}>
                                {!quoteSubmitted ? (
                                    <form onSubmit={handleQuoteSubmit} className="space-y-6">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                            <div>
                                                <label className="block text-xs font-mono text-gray-400 mb-2">{t.quote.name}</label>
                                                <input required name="name" type="text" placeholder=" Farid Sabry" className="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm focus:border-brand-blue outline-none" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-mono text-gray-400 mb-2">{t.quote.phone}</label>
                                                <input required name="phone" type="tel" placeholder="01018672132" className="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm focus:border-brand-blue outline-none" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                                            <div>
                                                <label className="block text-xs font-mono text-gray-400 mb-2">{t.quote.facility}</label>
                                                <select name="facility" className="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm focus:border-brand-blue outline-none">
                                                    <option value="مسجد / دار مناسبات">مسجد / دار مناسبات</option>
                                                    <option value="كنيسة">كنيسة</option>
                                                    <option value="مبنى حكومي">مبنى حكومي</option>
                                                    <option value="قاعة مؤتمرات">قاعة مؤتمرات</option>
                                                    <option value="ساحة خارجية">ساحة خارجية</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-mono text-gray-400 mb-2">{t.quote.currency}</label>
                                                <select name="currency" className="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm focus:border-brand-blue outline-none">
                                                    <option value="EGP">EGP (جنيه مصري)</option>
                                                    <option value="SAR">SAR (ريال سعودي)</option>
                                                    <option value="USD">USD (دولار أمريكي)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-mono text-gray-400 mb-2">{t.quote.budget}</label>
                                                <select name="budget" className="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm focus:border-brand-blue outline-none">
                                                    <option value="Essential">Essential Setup</option>
                                                    <option value="Professional">Professional Grade</option>
                                                    <option value="Advanced">Advanced Integrated</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-mono text-gray-400 mb-2">{t.quote.desc}</label>
                                            <textarea required name="desc" rows="4" className="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm focus:border-brand-blue outline-none" placeholder="اكتب التفاصيل والمساحة التقديرية والمشاكل الصوتية الحالية..."></textarea>
                                        </div>

                                        <button type="submit" className="w-full bg-gradient-to-r from-brand-orange to-brand-neonOrange text-white font-extrabold py-4 rounded-xl shadow-lg hover:shadow-brand-orange/40 transition-all uppercase text-xs">
                                            {t.quote.submit}
                                        </button>
                                    </form>
                                ) : (
                                    <div className="text-center py-8 space-y-6">
                                        <div className="w-16 h-16 bg-emerald-500/20 text-emerald-400 border border-emerald-500 rounded-full flex items-center justify-center text-3xl mx-auto">
                                            ✓
                                        </div>
                                        <h3 className="text-2xl font-bold">{t.quote.successTitle}</h3>
                                        <p className="text-sm text-gray-400 max-w-md mx-auto">{t.quote.successDesc}</p>
                                        <a 
                                            href={`https://wa.me/201018672132?text=${encodeURIComponent(`طلب تسعير جديد من: ${quoteData.name}\nهاتف: ${quoteData.phone}\nنوع المنشأة: ${quoteData.facility}\nالميزانية: ${quoteData.budget} (${quoteData.currency})\nالتفاصيل: ${quoteData.desc}`)}`}
                                            target="_blank" 
                                            className="inline-block bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3.5 rounded-xl text-xs uppercase"
                                        >
                                            {t.quote.whatsappBtn}
                                        </a>
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>

                    {/* PROJECT DETAILS MODAL */}
                    {selectedProject && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div className={`p-8 rounded-2xl max-w-lg w-full space-y-6 border border-brand-blue/40 ${isDark ? 'glass-dark' : 'glass-light'}`}>
                                <h3 className="text-2xl font-bold">{lang === 'ar' ? selectedProject.titleAr : selectedProject.titleEn}</h3>
                                <p className="text-sm text-gray-400 leading-relaxed">{lang === 'ar' ? selectedProject.descAr : selectedProject.descEn}</p>
                                <div className="space-y-2 text-xs font-mono">
                                    <div><span className="text-gray-500">TECHNOLOGY:</span> <span className="text-brand-blue">{selectedProject.tech}</span></div>
                                    <div><span className="text-gray-500">STI INTEL:</span> <span className="text-emerald-400">{selectedProject.sti}</span></div>
                                </div>
                                <button onClick={() => setSelectedProject(null)} className="w-full border border-gray-700 hover:border-brand-orange py-3 rounded-xl text-xs font-mono uppercase">
                                    {t.portfolio.closeModal}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="py-8 border-t border-gray-800/80 text-center text-xs font-mono text-gray-500 z-10 relative">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <AudioCrewLogo isDark={isDark} />
                            <p>{t.footer.rights}</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
